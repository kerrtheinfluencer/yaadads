name: Smoke Test

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'offline.html'
      - 'package.json'
      - 'package-lock.json'
      - 'js/**'
      - 'tools/**'
      - 'CHANGELOG.md'
      - 'style.css'
      - 'manifest.json'
      - 'logo.svg'
      - 'gas-prices.html'
      - 'ship-to-jamaica.html'
      - 'shipping-rates.json'
      - '.github/workflows/smoke-test.yml'
  pull_request:
    paths:
      - 'js/**'
      - 'tools/**'
      - 'style.css'
      - 'package.json'
      - '.github/workflows/smoke-test.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Check js/core.js has a Supabase key configured
        run: |
          if ! grep -q "key: 'eyJ" js/core.js; then
            echo "::error::No Supabase anon key found in js/core.js. CFG.supabase.key looks empty or malformed."
            exit 1
          fi
          echo "Supabase key present in config"

      - name: Check all JS has no syntax errors
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            let ok = true;

            // Inline <script> blocks in index.html
            const html = fs.readFileSync('index.html', 'utf8');
            const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)];
            if (scripts.length === 0) {
              console.error('No inline <script> blocks found. Check index.html.');
              ok = false;
            }
            scripts.forEach((m, i) => {
              try { new Function(m[1]); }
              catch (e) {
                ok = false;
                console.error('Syntax error in inline script block ' + i + ': ' + e.message);
              }
            });
            if (scripts.length) console.log('All ' + scripts.length + ' inline script blocks parse correctly');

            // External app modules in js/
            const dir = 'js';
            const files = fs.readdirSync(dir).filter(f => f.endsWith('.js'));
            for (const f of files) {
              try { new Function(fs.readFileSync(path.join(dir, f), 'utf8')); }
              catch (e) {
                ok = false;
                console.error('Syntax error in ' + f + ': ' + e.message);
              }
            }
            console.log('All ' + files.length + ' files in js/ parse correctly');

            if (!ok) process.exit(1);
          "

      - name: Verify service worker precache files exist
        run: |
          test -f style.css
          test -f offline.html
          test -f ship-to-jamaica.html
          test -f shipping-rates.json

      - name: Check shipping rates JSON is valid
        run: |
          node -e "JSON.parse(require('fs').readFileSync('shipping-rates.json'))"

      - name: Check ship-to-jamaica page is wired
        run: |
          grep -q 'ship-to-jamaica.html' index.html || { echo "::error::ship-to-jamaica.html link missing from index.html"; exit 1; }
          grep -q 'shipwForm' index.html || { echo "::error::ship widget missing from index.html"; exit 1; }
          test -f supabase/functions/parse-car-link/index.ts || { echo "::error::parse-car-link function missing"; exit 1; }
          if grep -q 'PASTE_ANON_KEY' ship-to-jamaica.html; then echo "::error::ship-to-jamaica.html still has placeholder key"; exit 1; fi
          echo "Ship-a-car page wired"

      - name: Verify the anon key is not expired
        run: |
          node -e "
            const fs = require('fs');
            const src = fs.readFileSync('js/core.js', 'utf8');
            const match = src.match(/key:\s*'([^']+)'/);
            if (!match) {
              console.error('Could not find CFG.supabase.key in js/core.js');
              process.exit(1);
            }
            const key = match[1];
            const payload = JSON.parse(Buffer.from(key.split('.')[1], 'base64').toString());
            const expDate = new Date(payload.exp * 1000);
            const now = new Date();
            const daysLeft = Math.floor((expDate - now) / (1000 * 60 * 60 * 24));
            console.log('Key expires: ' + expDate.toISOString().slice(0, 10) + ' (' + daysLeft + ' days from now)');
            if (daysLeft < 0) {
              console.error('::error::Supabase anon key is expired.');
              process.exit(1);
            }
            if (daysLeft < 30) {
              console.error('::warning::Supabase anon key expires in ' + daysLeft + ' days.');
            }
          "

      - name: Ping live Supabase REST endpoint
        run: |
          URL=$(grep -oP "url:\s*'\K[^']+" js/core.js | head -1)
          KEY=$(grep -oP "key:\s*'\K[^']+" js/core.js | head -1)
          STATUS=$(curl -s -o /tmp/resp.json -w "%{http_code}" "${URL}/rest/v1/ads?select=id&limit=1" \
            -H "apikey: ${KEY}" -H "Authorization: Bearer ${KEY}")
          echo "Supabase REST responded: HTTP $STATUS"
          cat /tmp/resp.json
          if [ "$STATUS" -ge 400 ]; then
            echo "::error::Supabase REST endpoint returned HTTP $STATUS. Check RLS policies, table name, or key validity."
            exit 1
          fi
          echo "Supabase is reachable and responding"

      - name: Run onboarding browser regression tests
        timeout-minutes: 5
        run: npm run test:onboarding

      # The stored-XSS gate. Everything the v1 chat got wrong is invisible to a
      # regex check - a hostile member name only becomes an XSS when a real
      # parser meets it - so this drives the real app in a headless browser with
      # hostile data. Skips itself (exit 0) if the runner has no Chrome; the
      # GitHub ubuntu image ships one at /usr/bin/google-chrome, and the test
      # resolves it the same way tools/test-onboarding.js does.
      - name: Run messaging end-to-end browser tests (stored XSS, read receipts)
        timeout-minutes: 5
        run: npm run test:msg-v2

      # Touch gestures on the photo lightbox. Drives real synthetic touch events
      # (swipe / flick / drag-to-dismiss / pinch / double-tap) in a headless
      # browser, and renders a generated ad page to PARSE its inline scripts —
      # the guard for the invalid-regex SyntaxError that had killed every ad
      # page's JavaScript (lightbox, gallery, view counter) without a single
      # source-level check noticing.
      - name: Run photo-gesture touch tests
        timeout-minutes: 5
        run: npm run test:photo

      # Pull to refresh. The page used to reload itself on a modest drag, on a
      # diagonal drag, and on any drag starting on a rail — and there was no way
      # to cancel once armed. This drives real touch events and asserts both.
      - name: Run pull-to-refresh gesture tests
        timeout-minutes: 5
        run: npm run test:ptr

      # Responsive layout gate: hero height, 44px category tap targets, the live
      # counters, the search collapse and — the one that used to fail on every
      # run — a sustained horizontal overflow check at 390px. The results bar's
      # control cluster was ~379px of non-wrapping flex, so a 390px phone gained
      # a stray sideways scroll and a 320px phone could not reach the layout
      # switch at all. It is green now, so it belongs in the gate.
      - name: Run responsive hero layout tests
        timeout-minutes: 5
        run: npm run test:hero

      # "Press Home, get home." The logo cleared two variables and then called
      # goPage('home'), which returns early when the home page is already active
      # — so after a category tap, a search or a ?parish= deep link the button
      # visibly did nothing. This drives the real app at 390px and asserts the
      # feed is rebuilt, the AI/parish filter is cleared, the page scrolls back
      # to the top, and the logo is a real <a href="/"> that never reloads.
      - name: Run home-navigation / logo reset tests
        timeout-minutes: 5
        run: npm run test:home

      - name: Run AI chat regression tests (pure core + wiring)
        run: |
          node tools/test-chat-v2.js
          node tools/test-chat-wiring.js

      # The single gate that matters most. Every suite below is a Node-builtin
      # script (no npm install needed), so this one step runs them all:
      # cleanup, verify-v2, chat, onboarding, data-safety, p1-parity, p1-no-cdn,
      # admin, reports and the For You ranking rules. Without it a pull request
      # can merge with a dead code path — a ReferenceError in the inline ad
      # view shipped for weeks because only a browser test caught it, and
      # nothing ran that test.
      - name: Run the full regression suite (npm test)
        run: npm test

      - name: Check v2 onboarding + recents are wired up
        run: |
          grep -q 'js/onboarding.js' index.html || { echo "::error::onboarding.js is not included in index.html"; exit 1; }
          grep -q 'js/recent.js' index.html || { echo "::error::recent.js is not included in index.html"; exit 1; }
          grep -q 'startOnboarding' index.html || { echo "::error::Replay Tour link missing from footer"; exit 1; }
          echo "Onboarding tour + recently-viewed wired up"

      - name: Check manifest.json is valid and has shortcuts
        run: |
          node -e "const m=require('./manifest.json'); if(!m.shortcuts||!m.shortcuts.length){console.error('manifest.json missing shortcuts');process.exit(1)}; if(!m.icons.some(i=>(i.purpose||'').includes('maskable'))){console.error('manifest.json missing maskable icon');process.exit(1)}; console.log('manifest.json valid - '+m.shortcuts.length+' shortcuts, maskable icons present')"

      - name: Check style.css braces are balanced
        run: |
          node -e "const c=require('fs').readFileSync('style.css','utf8'); const o=(c.match(/{/g)||[]).length, cl=(c.match(/}/g)||[]).length; if(o!==cl){console.error('Unbalanced braces: '+o+' open vs '+cl+' close');process.exit(1)} console.log('style.css balanced ('+o+' rule blocks)')"

      - name: Check logo.svg exists and index.html references it
        run: |
          test -s logo.svg || { echo "::error::logo.svg missing"; exit 1; }
          grep -q 'src="/logo.svg"' index.html || { echo "::error::index.html does not reference logo.svg"; exit 1; }
          echo "Shared logo.svg in place"

      - name: Check CHANGELOG.md matches SITE_UPDATES (auto-updated, warn only)
        run: |
          node tools/build-changelog.js
          if git diff --exit-code -- CHANGELOG.md; then
            echo "CHANGELOG.md in sync with SITE_UPDATES"
          else
            echo "::warning::CHANGELOG.md was stale — the Changelog Auto-Update workflow is committing the regenerated file. Locally this happens for you via .githooks/pre-commit (npm run hooks:install)."
          fi
