name: Cash Pot Scraper

on:
  schedule:
    # Every 15 min, 8am-9pm Jamaica time (UTC-5, no DST). Cron is UTC:
    # 13:00-23:45 and 00:00-02:00 UTC covers 8am-9pm Jamaica.
    - cron: '*/15 13-23 * * *'
    - cron: '*/15 0-2 * * *'
  workflow_dispatch: {}   # lets you trigger a manual run from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run scraper
        env:
          SUPABASE_URL: https://cquwshpsfybvgqodbxsf.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.CASHPOT_SUPABASE_SERVICE_KEY }}
        run: node scrape-cashpot.js
