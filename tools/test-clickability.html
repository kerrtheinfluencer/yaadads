<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Yaad Adz — clickability doctor</title></head>
<body>
<!-- DEV-ONLY. Boots the real app (new-user path), attempts real clicks on the
     onboarding modal/tour, and reports whether the page ends up clickable. -->
<pre id="out">DOCTOR_RESULT:pending</pre>
<iframe id="app" style="width:1280px;height:900px;border:0"></iframe>
<script>
(function () {
  var mobile = (location.search || '').indexOf('mobile=1') !== -1;
  var f = document.getElementById('app');
  f.style.width = mobile ? '412px' : '1280px'; // simulate a phone viewport
  f.src = '/'; // fresh profile → NEW USER → welcome modal should appear

  var phase = 0;            // 0=wait modal, 1=clicked skip, 2=tour check, 3=done
  var steps = 0;
  var res = {};
  var phase3StartedAt = 0;

  var timer = setInterval(function () {
    steps++;
    var d = null; try { d = f.contentDocument; } catch (e) {}
    if (!d || !d.body) { if (steps > 80) { res.fatal = 'app never became accessible'; finish(); } return; }

    var root = d.getElementById('obRoot');
    res.pill = !!d.getElementById('navSearchPill');
    res.cards = d.querySelectorAll('#homeGrid .ad-card').length;

    if (root) {
      res.welcomeOpen = root.classList.contains('ob-welcome-open');
      res.tourOpen = root.classList.contains('ob-tour-open');
      var ov = root.querySelector('.ob-overlay');
      var tip = d.getElementById('obTip');
      var spot = d.getElementById('obSpotlight');
      if (ov) {
        var cs = getComputedStyle(ov);
        res.overlayPointerEvents = cs.pointerEvents;
        res.overlayOpacity = cs.opacity;
      }
      res.tipShown = !!(tip && tip.classList.contains('show'));
      res.spotShown = !!(spot && spot.classList.contains('show'));
      res.bodyLocked = d.body.classList.contains('ob-locked');
    }

    if (phase === 0) {
      if (res.welcomeOpen) {
        var skip = d.getElementById('obSkip');
        if (skip) { skip.click(); res.skipClicked = true; phase = 1; }
      } else if (res.pill && steps > 45) {
        res.modalNeverAppeared = true;
        phase = 3; phase3StartedAt = steps;
      }
    } else if (phase === 1) {
      if (!res.welcomeOpen) {
        res.modalClosed = true;
        phase = 2;
      } else if (steps > 60) {
        res.modalClosed = false; // skip did NOT work → BLOCKED
        finish();
      }
    } else if (phase === 2) {
      if (res.tourOpen) {
        var tSkip = d.getElementById('obTipSkip');
        if (tSkip) { tSkip.click(); res.tourSkipClicked = true; }
      }
      if (!res.tourOpen && steps > 15) { res.tourClosed = true; phase = 3; phase3StartedAt = steps; }
      if (steps > 90) { phase = 3; phase3StartedAt = steps; }
    }

    if (phase === 3 && (steps - phase3StartedAt) > 5) finish();
    if (steps > 120) { res.timedOut = true; finish(); }
  }, 400);

  function finish() {
    clearInterval(timer);
    res.pageClickable =
      res.cards > 0 &&
      !res.welcomeOpen &&
      !(res.tourOpen && res.tipShown !== true);
    // Also expose raw state for debugging in the title, easier to parse headlessly
    var out = document.getElementById('out');
    out.textContent = 'DOCTOR_RESULT:' + JSON.stringify(res);
    document.title = 'DOCTOR_TITLE:' + JSON.stringify(res);
  }
})();
</script>
</body>
</html>
